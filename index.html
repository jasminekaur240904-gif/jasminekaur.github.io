case:()=>`<div class="eyebrow">SEO &amp; content marketing</div>

</div>

<div><b style="font-size:.8rem;color:var(--ac)">Role</b><div class="mut" style="font-size:.87rem;line-height:1.45">Founder, Content Strategist &amp; SEO Writer</div></div>

</div>
</div>
</div>
<div style="max-width:760px;margin-top:20px">
<h3>Why This Project Matters</h3>
<p style="max-width:700px">Caring for a dog is a real part of adulting. It brings daily routines, money choices, and new responsibilities before an owner feels ready. I run Adore Tails as a live practice campaign to test and apply real SEO and content marketing skills on a real website.</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin-top:16px">
<div class="card">
<span class="tag">01 · Positioning</span>
<h3>1. Story-Driven Positioning (Turning Guilt Into Confidence)</h3>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">The Character</b><br>Write for loving dog parents, especially first-time owners, who want a happy, healthy and well-behaved dog. Buyer personas keep each article grounded in everyday moments.</p>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">The Conflict</b><br>Conflicting, overwhelming online advice can leave owners stressed, guilty and unsure about everyday care.</p>
<p style="font-size:.9rem;margin:0"><b style="color:var(--ac)">The Resolution</b><br>Offer a calm, judgment-free space with simple, practical steps that help turn confusion into confidence and strengthen the human-dog bond.</p>

<div class="card">

<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">Finding the Audience</b><br>Listen for the questions and worries dog owners have around daily routines, food changes and everyday habits.</p>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">Keyword Research &amp; Search Intent</b><br>Use Ubersuggest, Google Autocomplete and Ahrefs to find primary and long-tail terms, related questions and the intent behind each search.</p>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">Competitor Research &amp; Content Gap Analysis</b><br>Review ranking articles, their keywords and structure to identify missing details and opportunities for clearer, more practical guidance.</p>
<p style="font-size:.9rem;margin:0"><b style="color:var(--ac)">Content Outlines</b><br>Plan H1–H3 headings, secondary keywords, common questions and internal-link ideas before drafting.</p>
</div>
<div class="card">
<span class="tag">03 · Execution</span>
<h3>3. Practical Content Writing &amp; On-Page Execution</h3>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">Clear, Helpful Writing</b><br>Use warm, plain language, short paragraphs, examples and step-by-step advice that busy dog parents can act on.</p>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">Heading &amp; Readability Structure</b><br>Organise each post with one H1, logical H2/H3 sections, bullets and FAQs for easy scanning on mobile and desktop.</p>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">Title Tags, Meta Descriptions &amp; URL Slugs</b><br>Write clear search titles, useful meta descriptions and concise slugs; place relevant keywords naturally without stuffing.</p>
<p style="font-size:.9rem;margin:0 0 10px"><b style="color:var(--ac)">Image Optimization &amp; Internal Linking</b><br>Use relevant images with descriptive alt text and contextual links between related guides.</p>
<p style="font-size:.9rem;margin:0"><b style="color:var(--ac)">Technical Basics &amp; Search Setup</b><br>Manage Blogger publishing, XML sitemaps and robots.txt; use Search Console for indexing checks and Analytics to understand reader interactions.</p>
</div>
</div>
</div>`,
zomato:()=>`<div class="eyebrow">Campaign strategy · Independent simulation</div>
<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0 18px">
<img src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Zomato_Logo.svg" alt="Zomato wordmark" style="width:clamp(125px,22vw,185px);height:auto;max-height:46px;object-fit:contain;object-position:left center">
<span class="tag">Mother's Day 2027</span><span class="tag">3–9 May 2027</span>
</div>
<h2>Ghar Jaisa Swaad</h2>
<p style="max-width:720px;font-size:1.08rem">A proposed food-discovery campaign that brings familiar, home-style Indian meals closer to people living away from home—using an emotional Mother's Day story to introduce a practical in-app meal collection.</p>
<div class="card" style="max-width:780px;margin:18px 0;padding:18px;border-left:4px solid #cb202d">
<div class="eyebrow" style="color:#cb202d;margin-bottom:6px">Campaign thought</div>
<div class="big">“Maa jaisa toh koi nahi. Par ghar jaisa swaad, ab thoda paas.”</div>
<p class="mut" style="font-size:.82rem;margin:9px 0 0">Zomato wordmark shown only to identify the brand in this independent concept. This is not an official Zomato campaign or advertisement.</p>
</div>
<h3>Campaign snapshot</h3>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(155px,1fr));max-width:780px">
<div class="card"><div class="eyebrow">Primary audience</div><div class="big">18–24</div><p class="mut" style="font-size:.84rem;margin:5px 0 0">Hostel and PG students who already use food delivery</p></div>
<div class="card"><div class="eyebrow">Campaign period</div><div class="big">7 days</div><p class="mut" style="font-size:.84rem;margin:5px 0 0">3–9 May 2027 · Mother's Day week</p></div>
<div class="card"><div class="eyebrow">Campaign idea</div><div class="big">Food discovery</div><p class="mut" style="font-size:.84rem;margin:5px 0 0">A curated collection of familiar, home-style Indian meals</p></div>
<div class="card"><div class="eyebrow">Proposed offer</div><div class="big">₹40 off</div><p class="mut" style="font-size:.84rem;margin:5px 0 0">On orders above ₹199 · hypothetical</p></div>
</div>
<h3>My campaign approach</h3>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(205px,1fr));max-width:780px">
<div class="card"><b style="color:var(--ac)">01 · Start with an insight</b><p style="font-size:.9rem;margin:6px 0 0">People living away from home may miss familiar meals. The campaign connects that feeling with a useful way to discover home-style food.</p></div>
<div class="card"><b style="color:var(--ac)">02 · Build a discovery experience</b><p style="font-size:.9rem;margin:6px 0 0">Use an in-app collection, regional food choices, relevant restaurant listings and genuine reviews to help people explore options.</p></div>
<div class="card"><b style="color:var(--ac)">03 · Make the offer work</b><p style="font-size:.9rem;margin:6px 0 0">Compare menu tiers, model the discount and restaurant-side economics, and identify commercial checks before launch.</p></div>
<div class="card"><b style="color:var(--ac)">04 · Measure beyond orders</b><p style="font-size:.9rem;margin:6px 0 0">Plan measures for reach, engagement, collection discovery, conversion, average order value, contribution margin and customer experience.</p></div>
</div>
<div class="card" style="max-width:780px;margin:18px 0">
<h3 style="margin-bottom:8px">What this project demonstrates</h3>
<p style="margin:0;font-size:.93rem">Audience and consumer insight · Emotional positioning · Customer psychology · Campaign touchpoint planning · Pricing architecture · Offer mechanics · Restaurant-side cost modelling · KPI selection · A/B experiment design · Commercial risk awareness</p>
</div>
<p class="ph" style="max-width:780px">Project status: Independent portfolio simulation. Not commissioned, approved, sponsored or executed by Zomato. No restaurant partners, customer research, customer data, campaign activity or performance results are claimed. All menu prices, offers, cost inputs and calculations are hypothetical. The campaign visual and Reel are concepts, not published advertising.</p>
<p class="mut" style="font-size:.86rem;max-width:780px">Tap each section to explore the campaign planning.</p>
<div style="max-width:780px">
<details><summary>01 · Campaign brief, audience &amp; funnel objectives</summary><div style="font-size:.91rem">
<h3>Campaign brief</h3><p>Propose a Mother's Day in-app collection featuring restaurants that offer comforting, home-style Indian meals. The collection is intended to make familiar food easier to discover for people living away from their families. No restaurant partners are named or assumed.</p>
<div class="card" style="margin:12px 0"><b style="color:var(--ac)">Primary audience</b><p style="margin:4px 0 10px">Hostel and PG students aged 18–24 who already use online food delivery. The audience hypothesis is that they may value affordable variety and familiar meals while living away from family.</p><b style="color:var(--ac)">Secondary audience</b><p style="margin:4px 0 0">Young adults living away from their families for work or study who may look for familiar, home-style meals when ordering online.</p></div>
<h3>Consumer insight &amp; value proposition</h3><p>Students living away from home may rely on food delivery for convenience but still miss familiar meals they enjoy with their families. This creates an opportunity to connect food discovery with the feeling of home.</p><p><b>Value proposition:</b> Discover familiar, comforting meals that bring the taste of home a little closer.</p>
<h3>Funnel objectives</h3>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Stage</th><th style="padding:8px;border-bottom:1px solid var(--line)">Objective</th><th style="padding:8px;border-bottom:1px solid var(--line)">What supports it</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Awareness</td><td style="padding:8px;border-bottom:1px solid var(--line)">Build an emotional connection through relatable Mother's Day storytelling.</td><td style="padding:8px;border-bottom:1px solid var(--line)">A story that feels relevant to the audience.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Interest</td><td style="padding:8px;border-bottom:1px solid var(--line)">Create curiosity about home-style Indian meals.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Food visuals, regional choices and relatable messaging.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Consideration</td><td style="padding:8px;border-bottom:1px solid var(--line)">Encourage collection discovery and exploration.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Easy app access, relevant options and genuine reviews.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Decision</td><td style="padding:8px;border-bottom:1px solid var(--line)">Help customers assess a meal and decide whether to order.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Clear prices, offer terms, delivery charges, ratings and availability.</td></tr>
<tr><td style="padding:8px">Conversion</td><td style="padding:8px">Encourage orders from the collection.</td><td style="padding:8px">Fair pricing, clear offer terms, reliable delivery and good restaurant ratings.</td></tr>
</tbody></table></div>
<p class="mut" style="font-size:.82rem;margin:10px 0 0">Planning principle: emotion can earn attention, but relevance and trust support consideration; price and convenience can help the purchase decision. Emotion alone does not guarantee sales.</p>
</div></details>
<details><summary>02 · Customer psychology &amp; creative concept</summary><div style="font-size:.91rem">
<h3>Psychology used thoughtfully</h3>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Concept</th><th style="padding:8px;border-bottom:1px solid var(--line)">Application</th><th style="padding:8px;border-bottom:1px solid var(--line)">Limit / safeguard</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Emotional marketing &amp; nostalgia</td><td style="padding:8px;border-bottom:1px solid var(--line)">A student eats a meal that reminds him of home.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Emotion earns attention, not an order. Use “ghar” alongside “Maa” and avoid assuming every viewer has a positive family experience.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Personalisation</td><td style="padding:8px;border-bottom:1px solid var(--line)">Offer optional regional food choices such as Punjabi, Bihari, South Indian, Bengali or Gujarati.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Let customers choose; include only cuisines participating restaurants can genuinely provide.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Priming</td><td style="padding:8px;border-bottom:1px solid var(--line)">Use familiar kitchen cues such as a steel dabba, steaming food and roti with ghee.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Visuals must accurately represent the real dishes.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Social proof</td><td style="padding:8px;border-bottom:1px solid var(--line)">Show genuine restaurant ratings and reviews.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Never invent reviews, ratings or “most reordered” labels; do not hide low ratings.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Scarcity &amp; urgency</td><td style="padding:8px;border-bottom:1px solid var(--line)">A real campaign collection and offer period of 3–9 May 2027.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Use only genuine time limits; no fake countdowns or stock claims.</td></tr>
<tr><td style="padding:8px">Social connection</td><td style="padding:8px">An optional Mother's Day message card for customers to share a message.</td><td style="padding:8px">Do not assume every customer has the same relationship with their mother.</td></tr>
</tbody></table></div>
<p><b>Not used — authority bias:</b> No relevant, genuine authority figure was identified for this concept, so the tactic was excluded.</p>
<h3>Proposed 30-second Instagram Reel: “Ghar Jaisa Khana”</h3>
<p class="mut">Storyboard concept only. No Reel has been produced or published.</p>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Time</th><th style="padding:8px;border-bottom:1px solid var(--line)">Scene</th><th style="padding:8px;border-bottom:1px solid var(--line)">Creative purpose</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">0–6 sec</td><td style="padding:8px;border-bottom:1px solid var(--line)">A mother pauses before lunch and wonders whether Chintu has eaten: “Pata nahi Chintu ne khana khaya bhi hoga ya nahi.”</td><td style="padding:8px;border-bottom:1px solid var(--line)">An emotional opening built around a familiar concern.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">6–12 sec</td><td style="padding:8px;border-bottom:1px solid var(--line)">Chintu receives a food parcel at his hostel and video-calls his mother. She asks if he is eating outside food; he says it feels like home-style food.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Relatable conversation and product context.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">12–20 sec</td><td style="padding:8px;border-bottom:1px solid var(--line)">He shows her a chapati and says the ghee roti reminds him of hers.</td><td style="padding:8px;border-bottom:1px solid var(--line)">Nostalgia and the emotional peak.</td></tr>
<tr><td style="padding:8px">20–30 sec</td><td style="padding:8px">They continue lunch together over video call. The campaign message and proposed offer appear on screen.</td><td style="padding:8px">Social connection and a clear transition to the collection.</td></tr>
</tbody></table></div>
<h3>Expected response pathway</h3><p>Emotional connection → trust and reassurance → collection exploration → purchase consideration → possible sharing and recall. These are intended behaviours, not observed results.</p>
</div></details>
<details><summary>03 · Menu architecture, pricing &amp; offer strategy</summary><div style="font-size:.91rem">
<p>Three illustrative meal tiers are designed to make the value differences easy to compare. These are not actual Zomato or restaurant menu prices.</p>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Option</th><th style="padding:8px;border-bottom:1px solid var(--line)">Menu concept</th><th style="padding:8px;border-bottom:1px solid var(--line)">Price</th><th style="padding:8px;border-bottom:1px solid var(--line)">Role</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">A</td><td style="padding:8px;border-bottom:1px solid var(--line)">Ghar Ka Thali: 4 rotis, dal and sabzi</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹129</td><td style="padding:8px;border-bottom:1px solid var(--line)">Budget anchor</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">B</td><td style="padding:8px;border-bottom:1px solid var(--line)">Desi Ghee Thali: 4 desi-ghee rotis, dal and sabzi</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹159</td><td style="padding:8px;border-bottom:1px solid var(--line)">Middle-priced comparison</td></tr>
<tr><td style="padding:8px">C</td><td style="padding:8px">Desi Ghee Thali with extra ghee and a small kheer/halwa cup</td><td style="padding:8px">₹179</td><td style="padding:8px">Target option to test</td></tr>
</tbody></table></div>
<h3>How the comparison may influence choice</h3><p>Option A anchors the lower price. Option B adds ghee for ₹30 more. Option C adds extra ghee and a sweet for ₹20 more than B. The sweet may make the upgrade feel worthwhile, but that is a hypothesis—not a proven decoy effect. Customers may still choose A or B based on budget and preference.</p>
<div class="card" style="margin:12px 0"><b>Illustrative upgrade check</b><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin:10px 0 0"><div><div class="eyebrow">B to C price rise</div><div class="big">₹20</div></div><div><div class="eyebrow">Assumed extra cost</div><div class="big">₹12</div></div><div><div class="eyebrow">Left before other costs</div><div class="big">₹8</div></div></div><p class="mut" style="font-size:.82rem;margin:8px 0 0">The ₹12 cost is a hypothetical input. Actual ingredient and packaging costs must be checked; the remaining ₹8 is not profit.</p></div>
<h3>Proposed Mother's Day offer</h3>
<div class="card" style="margin:12px 0"><div class="big">₹40 off orders above ₹199</div><p style="font-size:.88rem;margin:6px 0 0">A proposed flat discount, capped at ₹40 per order. The offer is intended to encourage collection trial while keeping the maximum discount explicit. Funding responsibility is undecided: restaurant, platform or shared.</p></div>
<p><b>Offer threshold:</b> An order of ₹199 does not qualify; an order above ₹199 does. The comparison below uses illustrative basket values.</p>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Basket</th><th style="padding:8px;border-bottom:1px solid var(--line)">Qualifies?</th><th style="padding:8px;border-bottom:1px solid var(--line)">₹40 flat</th><th style="padding:8px;border-bottom:1px solid var(--line)">20% off, max ₹40</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">₹180</td><td style="padding:8px;border-bottom:1px solid var(--line)">No</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹0</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹0</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">₹199</td><td style="padding:8px;border-bottom:1px solid var(--line)">No</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹0</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹0</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">₹200</td><td style="padding:8px;border-bottom:1px solid var(--line)">Yes</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹40</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹40</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">₹250</td><td style="padding:8px;border-bottom:1px solid var(--line)">Yes</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹40</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹40</td></tr>
<tr><td style="padding:8px">₹400</td><td style="padding:8px">Yes</td><td style="padding:8px">₹40</td><td style="padding:8px">₹40</td></tr>
</tbody></table></div>
<p class="mut" style="font-size:.82rem;margin:8px 0 0">For qualifying baskets just above ₹199 but below ₹200, 20% off is slightly less than ₹40. At ₹200 and above, both structures reach the ₹40 cap.</p>
<p><b>How the offer may increase basket size:</b> Option C at ₹179 plus a hypothetical ₹30 add-on creates a ₹209 basket that qualifies. The add-on should feel useful rather than pressured.</p>
</div></details>
<details><summary>04 · Commercial feasibility &amp; pre-launch checks</summary><div style="font-size:.91rem">
<h3>Illustrative restaurant-side model</h3>
<p>The example tests how the discount could affect the restaurant's remaining amount. Inputs are hypothetical and do not represent Zomato's actual commission or any restaurant agreement.</p>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><tbody>
<tr><td style="padding:7px;border-bottom:1px solid var(--line)">Example order (Option C + ₹30 add-on)</td><td style="padding:7px;border-bottom:1px solid var(--line)">₹209</td></tr>
<tr><td style="padding:7px;border-bottom:1px solid var(--line)">Food and packaging cost assumption</td><td style="padding:7px;border-bottom:1px solid var(--line)">40% = ₹83.60</td></tr>
<tr><td style="padding:7px;border-bottom:1px solid var(--line)">Platform commission assumption</td><td style="padding:7px;border-bottom:1px solid var(--line)">20% of original order = ₹41.80</td></tr>
<tr><td style="padding:7px;border-bottom:1px solid var(--line)">Amount before discount</td><td style="padding:7px;border-bottom:1px solid var(--line)">₹83.60</td></tr>
<tr><td style="padding:7px">Proposed discount</td><td style="padding:7px">₹40</td></tr>
</tbody></table></div>
<div style="overflow-x:auto;margin-top:10px"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Funding scenario</th><th style="padding:8px;border-bottom:1px solid var(--line)">Restaurant share</th><th style="padding:8px;border-bottom:1px solid var(--line)">Restaurant discount cost</th><th style="padding:8px;border-bottom:1px solid var(--line)">Remaining before other costs</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Restaurant funds all</td><td style="padding:8px;border-bottom:1px solid var(--line)">100%</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹40</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹43.60</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Shared equally</td><td style="padding:8px;border-bottom:1px solid var(--line)">50%</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹20</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹63.60</td></tr>
<tr><td style="padding:8px">Platform funds all</td><td style="padding:8px">0%</td><td style="padding:8px">₹0</td><td style="padding:8px">₹83.60</td></tr>
</tbody></table></div>
<p class="mut" style="font-size:.82rem;margin:8px 0 0">These figures are before other restaurant costs and do not calculate Zomato's own economics. Commission treatment, taxes, delivery charges and the discount funding agreement must be confirmed. The remaining amount is not net profit.</p>
<h3>Commercial checks before launch</h3>
<ul><li>Agree who funds the discount and how it is split.</li><li>Confirm how commission is calculated—on original or discounted order value.</li><li>Validate dish-level ingredient and packaging costs, including Option C extras.</li><li>Compare usual basket size with the ₹199 threshold to understand qualification and subsidy risk.</li><li>Assess new versus existing customer orders to avoid subsidising orders that would happen anyway.</li><li>Prevent stacking with other offers; confirm dates, per-customer limits, taxes, delivery charges and final payable amount.</li><li>Confirm restaurant capacity, menu availability and operational readiness for the campaign period.</li></ul>
</div></details>
<details><summary>05 · Campaign channels &amp; customer experience</summary><div style="font-size:.91rem">
<p>The touchpoints connect storytelling to meal discovery and the order decision.</p>
<div class="flow">
<div class="card"><b style="color:var(--ac)">Instagram Reel</b><p style="margin:4px 0 0">A proposed 30-second emotional story introducing the campaign idea and directing attention to the collection.</p></div><div class="arr">↓</div>
<div class="card"><b style="color:var(--ac)">Zomato app collection</b><p style="margin:4px 0 0">A dedicated Ghar Jaisa Swaad collection featuring relevant home-style Indian meal options from participating restaurants.</p></div><div class="arr">↓</div>
<div class="card"><b style="color:var(--ac)">In-app banner</b><p style="margin:4px 0 0">A proposed homepage banner directing customers to the collection.</p></div><div class="arr">↓</div>
<div class="card"><b style="color:var(--ac)">Restaurant listings</b><p style="margin:4px 0 0">Clear homestyle menu descriptions with genuine ratings and reviews.</p></div><div class="arr">↓</div>
<div class="card"><b style="color:var(--ac)">Optional message card</b><p style="margin:4px 0 0">A Mother's Day message card included with eligible orders, subject to restaurant participation and customer choice.</p></div>
</div>
<p class="mut" style="font-size:.82rem;margin:10px 0 0">All touchpoints are proposals. No restaurants, listings, app placements or packaging partners are confirmed.</p>
</div></details>
<details><summary>06 · Measurement framework &amp; experiment plan</summary><div style="font-size:.91rem">
<h3>Proposed KPIs — no results exist</h3>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Objective</th><th style="padding:8px;border-bottom:1px solid var(--line)">Measures</th><th style="padding:8px;border-bottom:1px solid var(--line)">How to interpret</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Awareness</td><td style="padding:8px;border-bottom:1px solid var(--line)">Reach, impressions, Reel views</td><td style="padding:8px;border-bottom:1px solid var(--line)">Attention and exposure, not proof of interest.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Engagement</td><td style="padding:8px;border-bottom:1px solid var(--line)">Shares, saves, comments</td><td style="padding:8px;border-bottom:1px solid var(--line)">Saves and shares may indicate stronger resonance than a quick like.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Discovery</td><td style="padding:8px;border-bottom:1px solid var(--line)">Collection visits, menu clicks</td><td style="padding:8px;border-bottom:1px solid var(--line)">Whether exposure leads to meal exploration.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Conversion</td><td style="padding:8px;border-bottom:1px solid var(--line)">Orders, conversion rate, offer redemptions</td><td style="padding:8px;border-bottom:1px solid var(--line)">Conversion rate = orders ÷ collection visits.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">Commercial performance</td><td style="padding:8px;border-bottom:1px solid var(--line)">Average order value, contribution margin</td><td style="padding:8px;border-bottom:1px solid var(--line)">AOV = order value ÷ orders. Contribution margin helps assess whether orders are commercially worthwhile after relevant costs.</td></tr>
<tr><td style="padding:8px">Customer experience</td><td style="padding:8px">Ratings and feedback</td><td style="padding:8px">Whether the delivered meal matches the promise.</td></tr>
</tbody></table></div>
<h3>Four proposed experiments</h3>
<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.84rem;text-align:left"><thead><tr><th style="padding:8px;border-bottom:1px solid var(--line)">Test</th><th style="padding:8px;border-bottom:1px solid var(--line)">Comparison</th><th style="padding:8px;border-bottom:1px solid var(--line)">Measures &amp; learning</th></tr></thead><tbody>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">1 · Reel style</td><td style="padding:8px;border-bottom:1px solid var(--line)">Emotional Reel vs product-focused creative</td><td style="padding:8px;border-bottom:1px solid var(--line)">Saves, shares and collection visits per view; assess whether emotion brings meaningful attention.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">2 · Offer wording</td><td style="padding:8px;border-bottom:1px solid var(--line)">₹40 off vs 20% off up to ₹40</td><td style="padding:8px;border-bottom:1px solid var(--line)">Redemptions and conversion rate; compare response to the offer framing.</td></tr>
<tr><td style="padding:8px;border-bottom:1px solid var(--line)">3 · Menu options</td><td style="padding:8px;border-bottom:1px solid var(--line)">Two options (A and C) vs three options (A, B and C)</td><td style="padding:8px;border-bottom:1px solid var(--line)">Share choosing C, AOV and contribution margin; this test alone cannot prove a decoy effect.</td></tr>
<tr><td style="padding:8px">4 · Collection design</td><td style="padding:8px">Generic collection vs regional cuisine filters</td><td style="padding:8px">Menu clicks and conversion rate; assess whether regional choice improves relevance.</td></tr>
</tbody></table></div>
<p><b>Fair testing:</b> Keep conditions consistent, change one variable at a time, randomly divide the audience, decide the success measure in advance and collect enough data before drawing a conclusion. These tests are planned ideas, not completed experiments.</p>
</div></details>
<details><summary>07 · Learning, reflection &amp; project transparency</summary><div style="font-size:.91rem">
<h3>What I learned through planning</h3>
<ul><li><b>Customer assumptions need validation:</b> Students living away from home may value familiar meals, but feedback is needed before treating this as a confirmed insight.</li><li><b>Price must feel justified:</b> A higher-priced meal should offer visible value and cover the restaurant's added costs.</li><li><b>Offers need commercial discipline:</b> A discount can attract attention but must be affordable for the businesses funding it.</li><li><b>Costs shape feasibility:</b> Estimated food costs and commission help frame the question; actual restaurant-level inputs are required before a decision.</li><li><b>Orders alone do not define success:</b> Discovery, conversion, AOV, contribution margin and customer experience should be considered together.</li><li><b>Experiments need structure:</b> Changing one variable at a time makes comparisons more useful.</li><li><b>Launch readiness matters:</b> Prices, restaurant availability, discount funding and offer conditions must be confirmed before launch.</li></ul>
<h3>Business impact the campaign aims to support</h3><p>More collection discovery, stronger order consideration, potential repeat engagement, word of mouth and an association between Zomato and convenient access to home-style meals. These are intended outcomes, not measured results.</p>
<h3>AI acknowledgement</h3><p>AI was used for supplementary brainstorming, guidance and refinement of selected content. The campaign concept, strategic choices, assumptions and final decisions were developed and reviewed by the project author.</p>
<h3>Project disclaimer</h3><p>This is an independent portfolio project. It is not commissioned, approved, sponsored or executed by Zomato. All proposed prices, offers, calculations, visuals, KPIs and projected outcomes are hypothetical. No restaurant partnerships, customer research, customer data or actual campaign results are claimed.</p>
</div></details>
</div>
<div class="btns"><a class="btn" href="#projects">Back to selected projects</a><a class="btn evidence" href="#evidence">Evidence</a></div>` ,

const evidenceObjectUrls={};
const evidenceSelectedFiles={};
function handleEvidenceFiles(input,targetId,multiple){
 const target=document.getElementById(targetId);if(!target)return;
 const incoming=Array.from(input.files||[]);
 if(!incoming.length)return;
 const current=evidenceSelectedFiles[targetId]||[];
 const combined=[...current];
 incoming.forEach(file=>{
  const duplicate=combined.some(existing=>existing.name===file.name&&existing.size===file.size&&existing.lastModified===file.lastModified);
  if(!duplicate)combined.push(file);
 });
 if(targetId==="adore-worksheet-files"&&combined.length>2){
  input.value="";
  target.innerHTML='<p class="evidence-empty">Only two research worksheets can be added. Remove a selected file before adding another.</p>';
  return;
 }
 evidenceSelectedFiles[targetId]=combined;
 (evidenceObjectUrls[targetId]||[]).forEach(url=>URL.revokeObjectURL(url));
 evidenceObjectUrls[targetId]=[];target.innerHTML="";
 combined.forEach(file=>{
  const url=URL.createObjectURL(file);evidenceObjectUrls[targetId].push(url);
  const a=document.createElement("a");a.className="evidence-file-link";a.href=url;a.target="_blank";a.rel="noopener";a.title="Open "+file.name;
  a.textContent="↗ "+file.name;a.addEventListener("click",ev=>ev.stopPropagation());target.appendChild(a);
 });
 input.value="";
}
function openFirstEvidenceFile(targetId){
 const a=document.querySelector("#"+targetId+" .evidence-file-link");if(a)window.open(a.href,"_blank","noopener");
}
function showAdoreTab(id){const ids=["ga4-detail","search-detail","pages-detail","country-detail","technical-detail","insights-detail"];if(!ids.includes(id))return;ids.forEach(key=>{const panel=document.getElementById("panel-"+key),tab=document.getElementById("tab-"+key);if(panel){panel.hidden=key!==id;panel.setAttribute("aria-hidden",key!==id?"true":"false");}if(tab){const active=key===id;tab.classList.toggle("active",active);tab.setAttribute("aria-selected",active?"true":"false");tab.tabIndex=active?0:-1;}});}
function route(){const raw=(location.hash.slice(1)||"home");const k=raw.toLowerCase();const p=V[k]?k:(k==="dashboard"||k==="ga4-overview"?"ga4":"home");
 document.getElementById("app").innerHTML=V[p]();
 if(p==="ga4")showAdoreTab("ga4-detail");

 document.title=(PAGES.find(x=>x[0]==p)[1])+" — Jasmine Kaur";scrollTo(0,0);

addEventListener("hashchange",route);route();
